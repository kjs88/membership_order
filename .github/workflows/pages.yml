name: Deploy order management to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build static site
        run: npm run build
      - name: Make project-site asset URLs relative
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path("dist/client")
          for path in root.rglob("*"):
              if path.suffix not in {".html", ".js", ".rsc"}:
                  continue
              text = path.read_text(encoding="utf-8")
              text = text.replace('"/_next/', '"./_next/').replace("'/_next/", "'./_next/")
              text = text.replace('href="/favicon.svg"', 'href="./favicon.svg"')
              text = text.replace('src="/favicon.svg"', 'src="./favicon.svg"')
              path.write_text(text, encoding="utf-8")
          PY
      - name: Add Pages marker
        run: touch dist/client/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
